[project]
name = "scraplink"
version = "0.1.0"
description = "ScrapLink backend: verified, valued and settled B2B trade in recyclable materials"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
worker = ["arq>=0.26"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
scraplink = "scraplink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraplink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
