# Vercel installs this for the API function (api/index.py): the backend package from backend/.
# Local development installs backend/ directly (see the README).
[project]
name = "scraplink-vercel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["scraplink[postgres]"]

[tool.uv.sources]
scraplink = { path = "backend" }
