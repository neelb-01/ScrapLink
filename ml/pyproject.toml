[project]
name = "scraplink-ml"
version = "0.1.0"
description = "ScrapLink inference service: confidence-scored material suggestions from a lot photo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10",
  # Install the CPU wheel first: pip install torch --index-url https://download.pytorch.org/whl/cpu
  "torch>=2.4",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraplink_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["model: loads the real CLIP weights (set RUN_MODEL_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
